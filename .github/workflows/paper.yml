# Workflow: Paper
#
# Purpose: Compile docs/paper/comparison.tex to PDF, upload it as a workflow
#          artifact, and (on main / manual dispatch) publish it to the
#          `paper` branch as comparison.pdf. Other files on that branch
#          (e.g. cla.pdf) are left untouched.
#
# Locally owned — not part of the Rhiza template.

name: PAPER

on:
  push:
    branches: [main]
    paths:
      - "docs/paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile comparison.tex
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: comparison.tex
          working_directory: docs/paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: comparison-pdf
          path: docs/paper/comparison.pdf
          if-no-files-found: error

  publish:
    name: Publish to paper branch
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout paper branch
        uses: actions/checkout@v6.1.0
        with:
          ref: paper

      - name: Download PDF artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: comparison-pdf
          path: .

      - name: Commit and push
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparison.pdf
          if git diff --cached --quiet; then
            echo "comparison.pdf unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Update comparison.pdf from ${SOURCE_SHA::7} [skip ci]"
          git push origin HEAD:paper

[project]
name = "cvxcla"
version = "1.8.2"
description = "Critical line algorithm for the efficient frontier"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.11",
    "cvx-linalg>=0.9.3",
]

authors = [{name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"},
           {name = "Philipp Schiele", email = "pschiele@stanford.edu"}]

[project.optional-dependencies]
plot = [
    "plotly>=6.0.1",
    "kaleido==1.3.0",
]

[project.urls]
Homepage = "https://github.com/cvxgrp/cvxcla"
Repository = "https://github.com/cvxgrp/cvxcla"


[dependency-groups]
dev = [
    "loguru==0.7.3",
    "mosek==11.2.2",
    "marimo==0.23.16",
    "pandas==3.0.5",
]
test = [
    "pytest>=7.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
]

# make a fresh `uv run pytest` work without knowing about dependency groups
[tool.uv]
default-groups = ["dev", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvxcla"]

[tool.interrogate]
# Nested helpers defined inside tests (objective functions, fake backends,
# mocks) are throwaway implementation detail, not documented API.
ignore-nested-functions = true
ignore-nested-classes = true

[tool.mypy]
# plotly ships no py.typed marker / stubs, so --strict cannot analyze it.
# The import is type-check-only (under TYPE_CHECKING) in types.py.
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

# Tests are organised by behaviour in a flat `tests/`, not mirrored per module, and
# the pure numeric kernels are exercised through the orchestrators that wire them up.
# Per-module coverage is guaranteed by the stricter mechanism instead: `make test`
# runs with COVERAGE_FAIL_UNDER=100, so a module with no exercising test fails CI
# regardless of what any test file is named.
[tool.check_test_layout]
enforce = false
reason = "Flat behaviour-oriented tests; private kernels (_kkt, _events, _projection, _lasso, _lasso_validate) are covered through cla.py/lasso.py, and per-module coverage is enforced by the full COVERAGE_FAIL_UNDER gate."

[tool.rhiza-task]
# Recovered from the make layer that rhiza v1.4.0 retired. Until v1.3.3 these
# lived in the root Makefile and .rhiza/.env, which the v1.4.2 sync deletes.
# They are NOT rhiza-task's defaults, so without this table the migration
# would have silently weakened four gates. Defaults below are as resolved by
# rhiza-task@0.3.1, the version .github/workflows/rhiza_ci.yml pins for every
# gate step (a repo-level RHIZA_TASK governs local `make` only).

# was: COVERAGE_FAIL_UNDER ?= 100 (root Makefile) | CLI default: 90
# Missing => the coverage gate drops to 90% with nothing in the diff saying
# so. There is no [tool.coverage.report] section in this file to fall back on,
# and it would not help anyway: `test` passes --cov-fail-under on the command
# line, which outranks the config file.
coverage_fail_under = 100

# was: TYPECHECKER ?= both (.rhiza/make.d/python.mk) | CLI default: "ty"
# Missing => mypy --strict stops running entirely and only `ty` guards src/.
# This is also strictly stronger than v1.3.3 was: the old shell `case` let
# mypy's exit status win, so a `ty` failure could still pass the gate.
typechecker = "both"

# was: MARIMO_FOLDER=book/marimo/notebooks (.rhiza/.env) | default: docs/notebooks
# Missing => the marimo gate looks in a directory that does not exist here and
# validates none of the real notebooks (book/marimo/notebooks/{cla,factor}.py).
marimo_folder = "book/marimo/notebooks"

# was: RHIZA_CI_OS_MATRIX=[...] (.rhiza/.env) | CLI default: ["ubuntu-latest"]
# Missing => CI silently narrows from three OSes to Linux only. This repo is
# currently running the full matrix (macos-latest and windows-latest jobs are
# green on main), and cvxcla ships BLAS-dependent numerics where the platform
# is exactly what varies.
ci_os_matrix = ["ubuntu-latest", "macos-latest", "windows-latest"]

# Deliberately NOT set -- each was checked against rhiza-task@0.3.1 and needs
# no entry. Listed so the next person does not re-add them:
#   source_folder          .rhiza/.env said "src"; that is already the default.
#   mkdocs_extra_packages  the Makefile said --with 'mkdocstrings[python]',
#                          which is now the default list. Naming the setting
#                          REPLACES that list, so a redundant line is the one
#                          someone edits to add a package and silently drops
#                          mkdocstrings from the book build with.
#   license_ignore_packages  the only entry was `+= docutils` from the
#                          template's own marimo.mk; rhiza-task appends
#                          docutils itself whenever marimo is registered.
#   pytest_rhiza           v1.3.3 had no RHIZA_CHECKS_VERSION pin and ran the
#                          in-tree .rhiza/tests/ instead, so the CLI default
#                          is an upgrade decision, not a preserved value.
#   license_fail_on, uv_sync_args, tests_folder, zensical_version,
#   book_output, layers, python_version  all matched the CLI default exactly.

[tool.deptry.per_rule_ignores]
DEP002 = ["kaleido"]

[tool.deptry.package_module_name_map]
cvx-linalg = "cvx"
numpy = "numpy"
plotly = "plotly"
kaleido = "kaleido"
loguru = "loguru"
mosek = "mosek"
marimo = "marimo"
pandas = "pandas"

# bump-my-version only auto-discovers .bumpversion.toml, .bumpversion.cfg,
# setup.cfg and pyproject.toml. Without a table here it falls back to
# `git describe`, so a release can be cut at an already-published version.
# It reads and rewrites [project].version natively — hence no current_version
# and no [[tool.bumpversion.files]] entry for it.
[tool.bumpversion]
allow_dirty = false
# The release flow commits and tags itself so the changelog lands in the bump commit.
commit = false
tag = false
